---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-instance
  namespace: flux-system
  labels:
    app: envoy-instance
    installer-type: fluxtamization
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: polaris-v1-git
  path: ./applications/envoy-instance/app
  prune: true
