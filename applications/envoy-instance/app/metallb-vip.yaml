---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: envoy-private
  namespace: metallb-system
spec:
  addresses:
    - 172.16.0.228/32
  autoAssign: true
  avoidBuggyIPs: false

---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: envoy-private-l2-ad
  namespace: metallb-system
spec:
  ipAddressPools:
    - envoy-private
