---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: polarisv1-duckdns-org
  namespace: cert-manager
spec:
  secretName: polarisv1-duckdns-org-tls
  issuerRef:
    name: cert-manager-duckdns-cert-manager-webhook-duckdns-production
    kind: ClusterIssuer
  commonName: "polarisv1.duckdns.org"
  dnsNames:
    - "polarisv1.duckdns.org"
    - "*.polarisv1.duckdns.org"

