---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-duckdns
  namespace: flux-system
  labels:
    app: cert-manager-duckdns
    installer-type: fluxtamization
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: polaris-v1-git
  path: ./applications/cert-manager-duckdns/app
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
