---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
  labels:
    app: cert-manager
    installer-type: helm
spec:
  interval: 10m
  targetNamespace: cert-manager
  releaseName: cert-manager
  timeout: 30m
  install:
    createNamespace: true
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: cert-manager-source
        namespace: flux-system
      interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: cert-manager-helm-values
