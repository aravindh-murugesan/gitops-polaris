---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
  labels:
    app: cert-manager
    installer-type: fluxtamization
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: polaris-v1-git
  path: ./applications/cert-manager/app
  prune: true
