apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./namespace.yaml
  - ./postgres-credentials-sops.yaml
  - ./config-secret-sops.yaml
  - ./superuser-secret-sops.yaml
  - ./postgres-cluster.yaml
  - ./oci-repository.yaml
  - ./helm-installer.yaml

configMapGenerator:
  - name: netbox-helm-values
    namespace: flux-system
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
    files:
      - values.yaml=_helm-values.yaml
