## NetBox Helm values (chart: netbox-community/netbox-chart)

# Use the pre-created, SOPS-encrypted secrets
existingSecret: netbox-config # secret_key, api_token_peppers, email_password
superuser:
  existingSecret: netbox-superuser # username, email, password, api_token

allowedHosts:
  - netbox.polarisw1.duckdns.org
allowedHostsIncludesPodIP: true # needed for kubelet probes

loginRequired: true

# Database: CloudNativePG cluster (netbox-postgres), not the bundled Bitnami chart
postgresql:
  enabled: false

externalDatabase:
  host: netbox-postgres-rw.netbox.svc.cluster.local
  port: 5432
  database: netbox
  username: netbox
  existingSecretName: netbox-postgres-credentials
  existingSecretKey: password
  options:
    sslmode: require # CNPG serves TLS by default
    target_session_attrs: read-write

# Tasks/cache: bundled Valkey, 3 nodes with Sentinel for automatic failover.
# The netbox chart derives the sentinel endpoints itself when valkey.enabled.
valkey:
  enabled: true
  architecture: replication
  sentinel:
    enabled: true
    primarySet: netbox-kv
    quorum: 2
  auth:
    # NetBox can't pass SENTINEL_KWARGS, so sentinel auth must stay off
    sentinel: false
  replica:
    replicaCount: 3
    persistence:
      storageClass: csi-cinder-sc-retain
      size: 1Gi

# Stateless: image attachments aren't used, so no media volume is needed.
# This lets the web pods scale freely without an RWX storage class.
persistence:
  enabled: false

replicaCount: 2

worker:
  enabled: true

# Exposed via Envoy Gateway, same as the other apps
httpRoute:
  enabled: true
  parentRefs:
    - name: envoy-private
      namespace: envoy-gateway-system
  hostnames:
    - netbox.polarisw1.duckdns.org

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi
