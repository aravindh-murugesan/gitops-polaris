---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-operator
  namespace: flux-system
  labels:
    app: metallb-operator
    installer-type: fluxtamization
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: polaris-v1-git
  path: ./operators/metallb/app
  prune: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: controller
      namespace: metallb-system
    - apiVersion: apps/v1
      kind: DaemonSet
      name: speaker
      namespace: metallb-system
