---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoriametrics-operator
  namespace: flux-system
  labels:
    app: victoriametrics-operator
    installer-type: fluxtamization
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: polaris-v1-git
  path: ./operators/victoriametrics/app
  prune: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: vm-operator
      namespace: vm
